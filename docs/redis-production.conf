# 🚀 O2OEG Production-Hardened Redis Configuration
# Path: /etc/redis/redis.conf or docker-compose volume

# 1. Network & Security
bind 127.0.0.1
protected-mode yes
port 6379

# 2. Memory Optimization (Crucial for single VPS Hostinger deployment)
# limit memory to 512MB to avoid OOM crashes
maxmemory 512mb
# Automatically evict old cache keys using Least Recently Used algorithm
maxmemory-policy allkeys-lru

# 3. Persistence (No loss of WhatsApp sessions or system registry)
# Save DB snapshot every 15 minutes if at least 1 key changed
save 900 1
save 300 10
save 60 10000

# Enable Append Only File (AOF) for real-time durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 4. CPU & Performance Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
