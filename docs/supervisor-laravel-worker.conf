# ⚙️ Supervisor Configuration for Laravel Queue Workers
# Path: /etc/supervisor/conf.d/o2oeg-worker.conf
# SYSTEM SECURITY & RECOVERY ASSURED

[program:o2oeg-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/o2oeg/backend/artisan queue:work redis --sleep=3 --tries=3 --timeout=300 --backoff=10,30,60
directory=/var/www/o2oeg/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/o2oeg/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
