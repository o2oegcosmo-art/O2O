# 🌉 Supervisor Configuration for WhatsApp Stateless Bridge Daemon
# Path: /etc/supervisor/conf.d/whatsapp-bridge.conf

[program:whatsapp-bridge]
directory=/var/www/o2oeg/whatsapp-bridge
command=node index.js
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/o2oeg/whatsapp-bridge/out.log
stderr_logfile=/var/www/o2oeg/whatsapp-bridge/error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PORT="9005",NODE_ENV="production"
stopwaitsecs=30
