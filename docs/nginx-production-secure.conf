# 🌐 O2OEG Production-Hardened Nginx Configuration
# Path: /etc/nginx/sites-available/o2oeg.com
# SECURE & STABLE PRODUCTION BLOCK

# 1. HTTP to HTTPS Force Redirect
server {
    listen 80;
    listen [::]:80;
    server_name o2oeg.com *.o2oeg.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Block (Secure, Hardened, High Performance)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name o2oeg.com *.o2oeg.com;

    # Root paths for frontend React SPA and Backend API fallback
    root /var/www/o2oeg/frontend/dist;
    index index.html index.htm;

    # SSL Certificates (managed by certbot let's encrypt)
    ssl_certificate /etc/letsencrypt/live/o2oeg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o2oeg.com/privkey.pem;
    
    # Hardened SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # Session Cache & Ticket optimizations
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # 🔒 Stage 2.4: Strict Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Compression (Gzip) Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --- SPA React Frontend Routes ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Laravel Backend API & Webhooks ---
    location ~ ^/(api|webhooks|storage|sanctum) {
        root /var/www/o2oeg/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        # FastCGI PHP parameters
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust PHP version accordingly
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Buffer optimizations for high-traffic API requests
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600s;
    }

    # --- Unofficial WhatsApp Bridge Proxy (Port 9005) ---
    location ~ ^/(status|init|send|logout|metrics|sessions) {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to .git, .env, etc.
    location ~ /\. {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/o2oeg_access.log;
    error_log /var/log/nginx/o2oeg_error.log warn;
}
